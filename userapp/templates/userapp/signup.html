{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup - Luxury PG</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Segoe UI', sans-serif;

            min-height: 100vh;

            background: #faf9f5;

            color: #102A43;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* ================= SIGNUP CARD ================= */

        .signup-card {

            width: 100%;

            max-width: 450px;

            background: #ffffff;

            padding: 40px;

            border-radius: 18px;

            border: 1px solid #eee5cf;

            box-shadow:
                0 10px 30px rgba(16, 42, 67, 0.10);

            text-align: center;
        }


        /* ================= LOGO ================= */

        .logo {

            margin-bottom: 15px;
        }

        .logo img {

            height: 60px;

            width: auto;
        }


        /* ================= HEADING ================= */

        .signup-card h1 {

            font-family: 'Playfair Display', serif;

            font-size: 34px;

            color: #102A43;

            margin-bottom: 10px;
        }


        .heading-line {

            width: 55px;

            height: 3px;

            background: #C58B19;

            border-radius: 10px;

            margin: 0 auto 12px;
        }


        .subtitle {

            color: #718096;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* ================= FORM ================= */

        form {

            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        input {

            width: 100%;

            height: 48px;

            padding: 0 15px;

            border: 1px solid #DDE5EC;

            border-radius: 9px;

            background: #FCFCFA;

            color: #102A43;

            font-size: 15px;

            outline: none;

            transition: all 0.3s ease;
        }


        input:focus {

            border-color: #C58B19;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(197, 139, 25, 0.10);
        }


        input::placeholder {

            color: #8A98A8;
        }


        /* ================= BUTTON ================= */

        button {

            width: 100%;

            height: 48px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #102A43;

            color: #ffffff;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        button:hover {

            background: #C58B19;

            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(197, 139, 25, 0.25);
        }


        /* ================= LOGIN LINK ================= */

        .login-text {

            margin-top: 22px;

            color: #718096;

            font-size: 14px;
        }


        .login-text a {

            color: #C58B19;

            text-decoration: none;

            font-weight: 600;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;
            }

            .signup-card {

                padding: 30px 20px;
            }

            .signup-card h1 {

                font-size: 29px;
            }

        }

    </style>

</head>


<body>


    <div class="signup-card">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="{% static 'images/Navlogo.png' %}"
                alt="Luxury PG"
            >

        </div>


        <!-- HEADING -->

        <h1>
            Create Account
        </h1>

        <div class="heading-line"></div>

        <p class="subtitle">
            Register your account with Luxury PG
        </p>


        <!-- SIGNUP FORM -->

        <form method="post">

            {% csrf_token %}


            <input
                type="text"
                placeholder="Enter username"
                required
                name="username"
            >


            <input
                type="email"
                placeholder="Enter Email"
                required
                name="email"
            >


            <input
                type="tel"
                placeholder="Enter Phone number"
                required
                name="phone"
            >


            <input
                type="password"
                placeholder="Enter Password"
                required
                name="password"
            >


            <button type="submit">
                Signup
            </button>

        </form>


        <div class="login-text">

            Already have an account?

            <a href="{% url 'user_login_link' %}">
                Login
            </a>

        </div>


    </div>


</body>

</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update User Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #faf9f5;
            color: #102A43;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            position: sticky;
            top: 0;

            background: linear-gradient(
                135deg,
                #FFFFFF 0%,
                #FFF9EA 50%,
                #F2E2B8 100%
            );

            box-shadow: 0 5px 20px rgba(184, 134, 11, 0.30);
        }

        .left {
            display: flex;
            align-items: center;
        }

        .left img {
            height: 50px;
            padding-left: 20px;
        }

        .right {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            width: 35%;
        }

        .right a {
            text-decoration: none;
            color: #102A43;
            font-weight: 600;

            border-bottom: 2px solid transparent;

            transition: all 0.3s ease;
        }

        .right a:hover {
            transform: scale(1.07);
            border-bottom: 2px solid #C58B19;
        }

        /* ================= PAGE ================= */

        .profile-page {
            min-height: calc(100vh - 75px);

            display: flex;
            justify-content: center;

            padding: 50px 20px;
        }

        /* ================= CARD ================= */

        .profile-card {
            width: 850px;

            background: #ffffff;

            border-radius: 18px;

            padding: 40px;

            border: 1px solid #eee5cf;

            box-shadow: 0 10px 30px rgba(16, 42, 67, 0.10);
        }

        .profile-card h1 {
            text-align: center;

            font-family: 'Playfair Display', serif;

            font-size: 32px;

            color: #102A43;

            margin-bottom: 10px;
        }

        .heading-line {
            width: 55px;
            height: 3px;

            background: #C58B19;

            border-radius: 10px;

            margin: 12px auto 35px;
        }

        .subtitle {
            text-align: center;

            color: #607080;

            margin-bottom: 30px;

            font-size: 15px;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 22px 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 14px;

            font-weight: 600;

            color: #102A43;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #DDE5EC;

            border-radius: 9px;

            background: #FCFCFA;

            color: #102A43;

            font-size: 15px;

            outline: none;

            transition: all 0.3s ease;
        }

        .form-group input {
            height: 46px;
        }

        .form-group textarea {
            min-height: 110px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #C58B19;

            background: #ffffff;

            box-shadow: 0 0 0 3px rgba(197, 139, 25, 0.10);
        }

        /* ================= FILE INPUT ================= */

        .form-group input[type="file"] {
            padding: 10px;

            cursor: pointer;

            background: #FFF9EA;
        }

        .form-group input[type="file"]::file-selector-button {
            border: none;

            background: #102A43;

            color: white;

            padding: 8px 13px;

            border-radius: 6px;

            margin-right: 10px;

            cursor: pointer;

            font-weight: 600;
        }

        .form-group input[type="file"]::file-selector-button:hover {
            background: #C58B19;
        }

        /* ================= BUTTON ================= */

        .button-area {
            display: flex;

            justify-content: center;

            margin-top: 35px;
        }

        .update-btn {
            border: none;

            padding: 13px 35px;

            background: #102A43;

            color: #ffffff;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        .update-btn:hover {
            background: #C58B19;

            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(197, 139, 25, 0.25);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .right {
                width: 50%;
            }

            .right a {
                font-size: 14px;
            }

            .profile-card {
                width: 100%;

                padding: 30px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }
        }

        @media (max-width: 500px) {

            .navbar {
                height: auto;

                min-height: 75px;

                padding: 10px;
            }

            .left img {
                height: 42px;

                padding-left: 5px;
            }

            .right {
                width: auto;

                gap: 15px;
            }

            .right a {
                font-size: 12px;
            }

            .profile-page {
                padding: 30px 15px;
            }

            .profile-card h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <div class="left">

            <img
                src="{% static 'images/Navlogo.png' %}"
                alt="PG Logo"
            >

        </div>

        <div class="right">

            <a href="{% url 'user_dashboard_link' %}">
                Dashboard
            </a>

            <a href="{% url 'user_profile_link' %}">
                Profile
            </a>

        </div>

    </div>


    <!-- ================= PROFILE UPDATE ================= -->

    <div class="profile-page">

        <div class="profile-card">

            <h1>Update User Profile</h1>

            <div class="heading-line"></div>

            <p class="subtitle">
                Complete your profile information
            </p>


            <form
                action=""
                method="post"
                enctype="multipart/form-data"
            >

                {% csrf_token %}


                <div class="form-grid">

                    <!-- CITY -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            value="{{ userprofile.city|default:'' }}"
                            placeholder="Enter your city"
                            required
                        >

                    </div>


                    <!-- PINCODE -->

                    <div class="form-group">

                        <label for="pincode">
                            Pincode
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            name="pincode"
                            value="{{ userprofile.pincode|default:'' }}"
                            placeholder="Enter your pincode"
                            required
                        >

                    </div>


                    <!-- STATE -->

                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            name="state"
                            value="{{ userprofile.state|default:'' }}"
                            placeholder="Enter your state"
                            required
                        >

                    </div>


                    <!-- COUNTRY -->

                    <div class="form-group">

                        <label for="country">
                            Country
                        </label>

                        <input
                            type="text"
                            id="country"
                            name="country"
                            value="{{ userprofile.country|default:'' }}"
                            placeholder="Enter your country"
                            required
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group full">

                        <label for="address">
                            Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            placeholder="Enter your complete address"
                            required
                        >{{ userprofile.address|default:'' }}</textarea>

                    </div>


                    <!-- BIO -->

                    <div class="form-group full">

                        <label for="bio">
                            Bio
                        </label>

                        <textarea
                            id="bio"
                            name="bio"
                            placeholder="Tell us something about yourself"
                            required
                        >{{ userprofile.bio|default:'' }}</textarea>

                    </div>


                    <!-- AADHAR NUMBER -->

                    <div class="form-group">

                        <label for="aadhar_no">
                            Aadhar Number
                        </label>

                        <input
                            type="text"
                            id="aadhar_no"
                            name="aadhar_no"
                            value="{{ userprofile.aadhar_no|default:'' }}"
                            placeholder="Enter Aadhar number"
                            required
                        >

                    </div>


                    <!-- AADHAR IMAGE -->

                    <div class="form-group">

                        <label for="aadhar_image">
                            Aadhar Image
                        </label>

                        <input
                            type="file"
                            id="aadhar_image"
                            name="aadhar_image"
                            accept="image/*"
                            {% if not userprofile.aadhar_image %}required{% endif %}
                        >

                    </div>


                    <!-- PROFILE PICTURE -->

                    <div class="form-group full">

                        <label for="profile_pic">
                            Profile Picture
                        </label>

                        <input
                            type="file"
                            id="profile_pic"
                            name="profile_pic"
                            accept="image/*"
                            {% if not userprofile.profile_pic %}required{% endif %}
                        >

                    </div>

                </div>


                <!-- BUTTON -->

                <div class="button-area">

                    <button
                        type="submit"
                        class="update-btn"
                    >
                        Update Profile
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>Update Profile</h1></center>
    <center>
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="username">Username :</label>
            <input type="text" id="username" placeholder="Enter your username" required name="username"> <br>
            <label for="email">Email :</label>
            <input type="email" id="email" placeholder="Enter your email" required name="email"> <br>
            <label for="phone">Enter phone :</label>
            <input type="number" id="phone" placeholder="Enter your Mob number" required name="phone"> <br>
            <label for="pic">Admin_pic :</label>
            <input type="file" id="pic" required name="admin_pic"> <br>
            <button>Update</button>
        </form>
    </center>
</body>
</html>

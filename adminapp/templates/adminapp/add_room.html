{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxury PG - Add Room</title>


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #FFFFFF 0%,
                    #FFF9EA 50%,
                    #F2E2B8 100%
                );

            color: #102A43;

            font-family: "Segoe UI", Arial, sans-serif;
        }


        h1,
        h2,
        h3 {
            font-family: "Playfair Display", Georgia, serif;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .navbar {

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                linear-gradient(
                    135deg,
                    #FFFFFF 0%,
                    #FFF9EA 50%,
                    #F2E2B8 100%
                );
            position: sticky;
            top: 0px;

            box-shadow:
                0 5px 20px rgba(184, 134, 11, 0.30);
        }


        .left {

            display: flex;

            align-items: center;
        }


        .left img {

            height: 55px;

            padding-left: 20px;

            display: block;
        }


        .right {

            width: 50%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: space-evenly;
        }


        .right a {

            text-decoration: none;

            color: #102A43;

            font-size: 17px;

            font-weight: 600;

            padding-bottom: 5px;

            border-bottom: 2px solid transparent;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }


        .right a:hover {

            transform: scale(1.07);

            border-bottom: 2px solid #C58B19;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page {

            padding: 45px 25px 60px;

            display: flex;

            justify-content: center;
        }


        /* =========================================
           FORM CARD
        ========================================= */

        .form-card {

            width: 850px;

            background: #FFFFFF;

            border: 1px solid #E8E0CF;

            border-radius: 18px;

            padding: 35px 45px 40px;

            box-shadow:
                0 12px 35px rgba(16, 42, 67, 0.10);
        }


        /* =========================================
           HEADING
        ========================================= */

        .heading {

            margin-bottom: 30px;
        }


        .small-title {

            color: #C58B19;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 7px;
        }


        .heading h1 {

            font-size: 31px;

            font-weight: 600;

            color: #102A43;
        }


        .heading-line {

            width: 50px;

            height: 3px;

            background: #C58B19;

            border-radius: 5px;

            margin-top: 10px;
        }


        /* =========================================
           FORM
        ========================================= */

        form {

            width: 100%;
        }


        .form-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 22px 25px;
        }


        .input-group {

            display: flex;

            flex-direction: column;
        }


        .input-group.full {

            grid-column: 1 / -1;
        }


        label {

            color: #486581;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid #D9E2EC;

            border-radius: 8px;

            background: #FCFBF7;

            color: #102A43;

            font-family: "Segoe UI", Arial, sans-serif;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        input,
        select {

            height: 46px;

            padding: 0 13px;
        }


        textarea {

            min-height: 105px;

            padding: 12px 13px;

            resize: vertical;
        }


        input::placeholder,
        textarea::placeholder {

            color: #9FB3C8;
        }


        input:hover,
        select:hover,
        textarea:hover {

            border-color: #C7B078;

            background: #FFFDF8;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #C58B19;

            background: #FFFFFF;

            box-shadow:
                0 0 0 3px rgba(197, 139, 25, 0.10);
        }


        /* =========================================
           FILE INPUT
        ========================================= */

        input[type="file"] {

            padding: 10px;

            cursor: pointer;

            background: #FCFBF7;
        }


        input[type="file"]::file-selector-button {

            border: none;

            padding: 7px 13px;

            margin-right: 10px;

            border-radius: 6px;

            background: #102A43;

            color: white;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .button-section {

            margin-top: 30px;

            display: flex;

            justify-content: flex-end;
        }


        .add-btn {

            border: none;

            padding: 12px 28px;

            border-radius: 8px;

            background: #102A43;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .add-btn:hover {

            background: #C58B19;

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(197, 139, 25, 0.22);
        }


        .add-btn:active {

            transform: translateY(0);
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 900px) {

            .right {

                width: 65%;
            }

            .right a {

                font-size: 15px;
            }

            .form-card {

                width: 90%;
            }
        }


        @media (max-width: 700px) {

            .navbar {

                height: auto;

                min-height: 75px;

                padding: 10px 0;

                flex-direction: column;

                gap: 12px;
            }


            .left img {

                padding-left: 0;
            }


            .right {

                width: 100%;

                flex-wrap: wrap;

                gap: 15px;

                padding-bottom: 8px;
            }


            .page {

                padding: 30px 15px;
            }


            .form-card {

                width: 100%;

                padding: 30px 25px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .input-group.full {

                grid-column: auto;
            }
        }


        @media (max-width: 450px) {

            .right {

                gap: 10px;
            }


            .right a {

                font-size: 13px;
            }


            .form-card {

                padding: 25px 18px;
            }


            .heading h1 {

                font-size: 27px;
            }


            .button-section {

                justify-content: stretch;
            }


            .add-btn {

                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <div class="navbar">

        <div class="left">

            <img
                src="{% static 'images/Navlogo.png' %}"
                alt="PG Logo"
            >

        </div>


        <div class="right">

            <a href="{% url 'add_room_link' %}">
                Add Room
            </a>

            <a href="">
                Manage Room
            </a>

            <a href="{% url 'notice_link' %}">
                Notice
            </a>

            <a href="{% url 'admin_profile_link' %}">
                Profile
            </a>

        </div>

    </div>



    <!-- =========================================
         ADD ROOM PAGE
    ========================================== -->

    <div class="page">

        <div class="form-card">


            <!-- HEADING -->

            <div class="heading">

                <p class="small-title">
                    PROPERTY MANAGEMENT
                </p>

                <h1>
                    Add New Room
                </h1>

                <div class="heading-line"></div>

            </div>



            <!-- FORM -->

            <form
                method="post"
                enctype="multipart/form-data"
            >

                {% csrf_token %}


                <div class="form-grid">


                    <!-- ROOM NUMBER -->

                    <div class="input-group">

                        <label>
                            Room Number
                        </label>

                        <input
                            type="text"
                            placeholder="Enter room number"
                            required
                            name="room_no"
                        >

                    </div>



                    <!-- FLOOR -->

                    <div class="input-group">

                        <label>
                            Floor Number
                        </label>

                        <input
                            type="text"
                            placeholder="Enter floor number"
                            required
                            name="floor_no"
                        >

                    </div>



                    <!-- ROOM TYPE -->

                    <div class="input-group">

                        <label>
                            Room Type
                        </label>

                        <select
                            name="room_type"
                            required
                        >

                            <option value="">
                                Select Room Type
                            </option>

                            <option value="2 Sharing">
                                2 Sharing
                            </option>

                            <option value="3 Sharing">
                                3 Sharing
                            </option>

                            <option value="4 Sharing">
                                4 Sharing
                            </option>

                        </select>

                    </div>



                    <!-- BEDS -->

                    <div class="input-group">

                        <label>
                            Number of Beds
                        </label>

                        <input
                            type="number"
                            placeholder="Enter number of beds"
                            required
                            name="bed_no"
                            min="1"
                        >

                    </div>



                    <!-- RENT -->

                    <div class="input-group">

                        <label>
                            Monthly Rent
                        </label>

                        <input
                            type="number"
                            placeholder="Enter monthly rent"
                            required
                            name="rent"
                            min="0"
                        >

                    </div>



                    <!-- RATING -->

                    <div class="input-group">

                        <label>
                            Rating
                        </label>

                        <input
                            type="number"
                            placeholder="Enter rating"
                            required
                            name="rating"
                            min="0"
                            max="5"
                            step="0.1"
                        >

                    </div>



                    <!-- STATUS -->

                    <div class="input-group">

                        <label>
                            Room Status
                        </label>

                        <select
                            name="status"
                            required
                        >

                            <option value="">
                                Select Status
                            </option>

                            <option value="Available">
                                Available
                            </option>

                            <option value="Full">
                                Full
                            </option>

                        </select>

                    </div>



                    <!-- ROOM IMAGE -->

                    <div class="input-group">

                        <label>
                            Room Image
                        </label>

                        <input
                            type="file"
                            required
                            name="room_image"
                            accept="image/*"
                        >

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="input-group full">

                        <label>
                            Room Description
                        </label>

                        <textarea
                            name="description"
                            placeholder="Enter room description"
                            required
                        ></textarea>

                    </div>



                    <!-- REVIEW -->

                    <div class="input-group full">

                        <label>
                            Review
                        </label>

                        <textarea
                            name="review"
                            required
                            placeholder="Enter room review"
                        ></textarea>

                    </div>


                </div>



                <!-- BUTTON -->

                <div class="button-section">

                    <button
                        type="submit"
                        class="add-btn"
                    >
                        Add Room
                    </button>

                </div>


            </form>


        </div>

    </div>


</body>

</html>
